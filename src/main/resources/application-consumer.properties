consumer.name=event-consumer
consumer.topic=order-events
consumer.retry-count=3
server.port=8090
spring.kafka.consumer.bootstrap-servers=localhost:9094, localhost:9095, localhost:9096
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=consumer-group-101
spring.kafka.consumer.client-id=CA1
spring.kafka.bootstrap-servers=localhost:9094, localhost:9095, localhost:9096
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.enableIdempotence=true
logging.level.org.springframework.boot.context.properties=DEBUG